        h2 {
            text-align: center;

            font-weight: 400;
            font-style: normal;
            font-size: 16px;
        }

        ::placeholder {
            color: whitesmoke;
            opacity: 0.65;
        }

        #addBtn {
            --color: rgb(78, 189, 30);
            --color2: rgb(73, 162, 35);
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }

        li {
            display: flex;
            font-family: "Betania Patmos", cursive;
            color: whitesmoke;
            justify-content: space-between;
            align-items: center;
            background-color: #23a61c;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
            padding: 10px;
            border-radius: 20px;
        }
        

        button {
            font-family: inherit;
            display: inline-block;
            width: 6em;
            height: 2.6em;
            line-height: 2.5em;
            overflow: hidden;
            cursor: pointer;
            margin: 20px;
            font-size: 16px;
            z-index: 1;
            background-color: var(--color);
            color: whitesmoke;
            border: 2px solid var(--color);
            border-radius: 6px;
            position: relative;
        }

        button::before {
            position: absolute;
            content: "";
            background: var(--color2);
            width: 150px;
            height: 200px;
            z-index: -1;
            border-radius: 50%;
        }   

        button:hover {
            color: whitesmoke;
        }

        button:before {
            top: 100%;
            left: 100%;
            transition: 0.3s all;
        }

        button:hover::before {
            top: -30px;
            left: -30px;
        }

        .edit {

<body>
    <div class="container">
        <h2>To-Do List</h2>
        <input type="text" id="taskInput" placeholder="Enter Task">
        <button class="addBtn" id="addBtn">Add</button>
        <ul id="taskList"></ul>
    </div>
    <script src="DOMScript.js"></script>
