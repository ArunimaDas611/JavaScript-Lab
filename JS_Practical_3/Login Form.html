<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Log In</title>
    <style>
        body {
            background-color: #82d6eb;
            justify-content: center;
        }

        h2 {
            text-align: center;
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 500px;
            margin: 60px auto;
            padding: 10px;
            background-color: #ffe54f;
            border-radius: 10px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.1);
            border: 2px solid black;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 50%;
            margin-left: 125px;
        }

        label {
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: 22px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 5px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .login {
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: 22px;
            background-color: #4CAF50;
            color: white;
            padding: 10px;
            text-align: center;
            display: inline-block;
            cursor: pointer;
            border-radius: 5px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 style="margin-bottom: 20px; margin-top: 10px;">Login Form</h2>
        <form>
            <label for="email">Email:</label><br>
            <input type="email" id="email" placeholder="Enter email" required><br>
            <label for="password">Password:</label><br>
            <input type="password" id="password" placeholder="Enter password" required><br><br>
            <button type="button" value="Log In" class="login" onclick="verifyLogin()">Log In</button>
        </form>
    </div>
    <script src="LoginScript.js"></script>
    <h3>Designed by Arunima Das, PRN: 24070521007</h3>
</body>
</html>
