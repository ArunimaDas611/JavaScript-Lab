<!DOCTYPE html>
<html>
<head>
    <title>Palindrome Checker</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background-color: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(4px);
            border-radius: 20px;
            padding: 40px 50px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }

        h2 {
            font-family: Arial, Helvetica, sans-serif;
            color: rgb(232, 21, 21);
            text-shadow: 0px 1px 2px rgba(0, 0, 0, 0.1);
            letter-spacing: 1px;
            margin-top: 0;
        }

        label {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: 30px;
            padding: 10px;
        }

        input {
            border: 2px solid black;
            border-radius: 10px;
            font-size: 30px;
            padding: 5px 10px;
            box-shadow: 0 3px 6px rgb(0, 0, 0);
            margin-bottom: 10px;
        }

        hr {
            border: none;
            border-top: 2px dashed rgba(0, 0, 0, 0.3);
            margin: 20px 0;
        }

        button {
            background-color: rgb(241, 35, 35);
            color: white;
            font-size: 18px;
            font-family: Arial, Helvetica, sans-serif;
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.4);
            transition: transform 0.15s ease, background-color 0.15s ease;
        }

        button:hover {
            background-color: rgb(200, 20, 20);
            transform: scale(1.05);
        }

        #output {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 24px;
            font-weight: bold;
            color: #003c3c;
            background-color: white;
            display: inline-block;
            min-width: 250px;
            margin-top: 15px;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.3);
        }
    </style>
    <script src="PalindromeScript.js"></script>
</head>
<body style="background-color:rgb(27, 224, 198); text-align: center;">
    <div class="card">
        <h2>Palindrome Checker</h2>
        <br>
        <label>Enter A Word:</label>
        <input type="text" id="word">
        <br><br>
        <button onclick="checkPalindrome()">Check Palindrome</button>
        <hr>
        <br>
        <div id='output'></div>
        <h3>Designed by Arunima Das, PRN: 24070521007</h3>
    </div>
</body>
</html>
