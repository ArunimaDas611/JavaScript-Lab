<!DOCTYPE html>
<html>
<head>
    <title>Local Storage and Session Storage</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            padding: 50px;
            transition: 0.5s ease-in;
        }

        .dark {
            background-color: #222;
            color: white;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Theme Preference</h1>
    <button onclick="setTheme('light');">Light</button>
    <button onclick="setTheme('dark');">Dark</button>
    <button onclick="clearTheme();">Clear Preference</button>

    <p id="message"></p>
    <script src="ThemeScript.js"></script>
</body>
</html>
