<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Bot Detector</title>
    <style>
        body {
            background-color: #1DA1F2;
            text-align: center;
        }

        h2, h3 {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: white;
        }

        .card {
            border: 3px solid transparent;
            text-align: center;
            padding: 10px;
            margin-top: 25px;
            width: max-width;
            background: #1DA1F2;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.1)) padding-box;
            background: linear-gradient(45deg, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0)) border-box;
            border-radius: 15px;
            backdrop-filter: blur(20px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        label {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: white;
            font-size: 20px;
            text-shadow: 0 1px 2px black;
        }

        input, textarea {
            margin-top: 10px;
            width: 50rem;
            border-radius: 8px;
            box-shadow: 0 1px 2px black;
        }

        button {
            margin-top: 10px;
            background-color: #0b5a8b;
            font-size: 20px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color:white;
            border-radius: 8px;
            box-shadow: 0 1px 2px black;
        }
    </style>
</head>
<body>
    <h2>Is This Account A Bot?</h2>
    <div class="card">
        <label>Enter its bio</label><br>
        <input type="text" id="bio">
        <br><br>
        <label>Enter the content of one of its posts</label><br>
        <textarea rows="5" id="post"></textarea>
        <br><br>
        <button onclick="checkIfBot();">Submit</button>
    </div>
    <div id="output"></div>
    <script src="BotCheckScript.js"></script>
</body>
</html>
