<html>
<head>
	<title>JavaScript Test</title>
	<script>
		function showWelcome() {
			let name = document.getElementById("name").value;
			let age = document.getElementById("age").value;

			document.getElementById("output").innerHTML = 
				"<h4>Welcome, " + name + "!</h4>" +
				"<p>Your Age is: " + age + "</p>";

			console.log("User Name: " + name);
			console.info("User Age: " + age);
			console.warn("This is a warning.");
			console.error("This is an error (for demo).");
		}

		function addLine() {
			document.getElementById("line").innerHTML = 
			"<p>Hello There.</p>";
		}
	</script>
</head>
<body style="background-color: azure;">
	<h3 style="font-family:'Times New Roman', Times, serif">Hi. This is a test for JavaScript.</h3>
	<div id="line"></div>
	<label>Enter Name: </label>
	<input type="text" id="name" placeholder="John Doe">
	<br><br>
	<label>Enter Age: </label>
	<input type="number" id="age" placeholder="35">
	<br><br>
	<button onclick="showWelcome(); greet();">Click to see the result</button>
	<br><br>
	<button onclick="addLine();">Click to add a sample line.</button>
	<hr>
	<div id="output"></div>
	<br><br>
	<h3>Designed by Arunima Das, PRN: 24070521007</h3>
	<script src="TestScript.js"></script>
</body>
</html>
