<!DOCTYPE HTML>
<html>
<head>
    <meta charset="UTF-8">
    <title>Billing Calculator</title>
    <style> 
    
        h2 {
            text-align: center;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }

        h3 {
            text-align: center;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }

        .form {
            margin-left: 20%;
            margin-right: 20%;
            margin-top: 50px;
            background-color: rgb(77, 173, 218);
            border-radius: 20px;
            padding: 10px;
        }

        label {
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-size: 16px;
            margin-left: 15px;
        }

        input {
            border-radius: 5px;
            box-shadow: rgb(0, 0, 0);
        }

        .btn {
            text-align:  center;
        }

        button {
            background-color: crimson;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            margin-top: 10px;
        }
        
    </style>
</head>
<body style="background-color: wheat;">
    <h2 style="color: rgb(0, 0, 0); font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">Grocery Store</h2>
    <div class="form">
        <label>Customer Name: </label>
        <input type="text" id="name" placeholder="John Doe">
        <br><br>
        <label>Product Name: </label>
        <input type="text" id="product" placeholder="Apple">
        <br><br>
        <label>Price: </label>
        <input type="number" id="price" placeholder="10">
        <br><br>
        <label>Quantity: </label>
        <input type="number" id="quantity" placeholder="1">
        <br>
    </div>
    <div class="btn">
        <button onclick="calculateBill();">Generate Bill</button><br><br>
    </div>
    <hr>
    <div id="output"></div>
    <br><br>
    <h3>Designed by Arunima Das, PRN: 24070521007</h3>
    <script src="BillScript.js"></script>
</body>
</html>
