<!DOCTYPE HTML>
<html>
<head>
    <meta charset="UTF-8">
    <title>Online Shopping Website</title>
    <style>
        h2 {
            text-align: center;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            color:rgb(81, 146, 15);
        }

        h3 {
            text-align: center;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            color:rgb(81, 146, 15);
        }

        .menu {
            display: grid;
            grid-template-columns: auto auto auto auto;
            grid-template-rows: auto auto;
            margin-top: 15%;
            margin-left: 10%;
            margin-right: 10%
        }

        .menu div {
            background-color: whitesmoke;
            color: black;
            border: 1px solid black;
            margin-right: 10px;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            padding: 10px;
        }

        .form {
            background-color: rgb(81, 146, 15);
            margin-top: 30px;
            padding: 10px;
            margin-left: 20%;
            margin-right: 20%;
        }

        .form label {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 16px;
            margin-left: 10px;
        }

        .form input {
            font-size: 16px;
            margin-left: 5px;
            border: 1px solid black;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);;
        }

        .btn {
            text-align: center;
        }

        button {
            background-color: rgb(50, 128, 230);
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: 20px;
        }
    </style>
</head>
<body style="background-color: rgb(230, 195, 41);">
    <h2>Welcome to Blicki!</h2>
    <div class="menu">
        <div>
            <img src="24894625_WAJ2826BIN_STP_def.png" alt="Washing Machine" width="150" height="150">
            <p>Washing Machine</p>
            <p>Price: ₹18,000</p>
        </div>
        <div>
            <img src="24894625_WAJ2826BIN_STP_def.png" alt="Washing Machine" width="150" height="150">
            <p>Washing Machine</p>
            <p>Price: ₹18,000</p>
        </div>
        <div>
            <img src="24894625_WAJ2826BIN_STP_def.png" alt="Washing Machine" width="150" height="150">
            <p>Washing Machine</p>
            <p>Price: ₹18,000</p>
        </div>
        <div>
            <img src="24894625_WAJ2826BIN_STP_def.png" alt="Washing Machine" width="150" height="150">
            <p>Washing Machine</p>
            <p>Price: ₹18,000</p>
        </div>
    </div>
    <h3>Enter the products you want to buy</h3>
    <div class="form">
        <label>Customer Name: </label>
        <input type="text" id="customer" placeholder="John Doe">
        <br><br>
        <label>Product Name: </label>
        <input type="text" id="product" placeholder="Apple">
        <br><br>
        <label>Price: </label>
        <input type="number" id="price" placeholder="10">
        <br><br>
        <label>Quantity: </label>
        <input type="number" id="quantity" placeholder="1">
        <br><br>
        <label>Discount (in %): </label>
        <input type="number" id="discount" placeholder="2">
    </div>
    <br><br>
    <div class="btn">
        <button onclick="calculateBill();">Generate Bill</button>
    </div>
    <br>
    <hr>
    <br>
    <div id="output"></div>
    <h3>Designed by Arunima Das, PRN: 24070521007</h3>
    <script src="ShoppingScript.js"></script>
</body>
</body>
</html>
