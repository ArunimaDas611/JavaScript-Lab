<!DOCTYPE html>
<html>
<head>
    <title>Gym Admission Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Betania+Patmos&family=Bree+Serif&family=Playwrite+BR+Guides&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Bree Serif", serif;
            font-weight: 400;
            font-style: normal;
            background: #e36701;
        }

        .container {
            width: 500px;
            margin: 40px auto;
            padding: 15px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            box-shadow: 0 5px 10px black;
            backdrop-filter: blur(20%);
        }

        h2 {
            text-align: center;
            font-size: 30px;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input, select {
            width: 95%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 3px;
        }

        .error {
            color: red;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 13px;
        }

        .success {
            color: green;
            font-size: 13px;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background: #e77416;
            font-family: "Bree Serif", serif;
            font-weight: 400;
            font-style: normal;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="container" class="container">
        <h2>Gym Admission Form</h2>
        <form id="gymForm">
            <label>Full Name</label>
            <input type="text" id="name">
            <span id="nameError" class="error"></span>

            <label>Age</label>
            <input type="number" id="age">
            <span id="ageError" class="error"></span>

            <label>Email</label>
            <input type="text" id="email">
            <span id="emailError" class="error"></span>

            <label>Mobile Number</label>
            <input type="text" id="mobile">
            <span id="mobileError" class="error"></span>

            <label>Membership Plan</label>
            <select id="plan">
                <option value="">Select Plan</option>
                <option>Monthly</option>
                <option>Quarterly</option>
                <option>Yearly</option>
            </select>
            <span id="planError" class="error"></span>
            <button id=submit type="submit">Submit</button>
            </form>
            <strong>
                <p id="result" class="success"></p>
            </strong>
        </form>
    </div>
    <script src="GymScript.js"></script>
</body>
</html>
