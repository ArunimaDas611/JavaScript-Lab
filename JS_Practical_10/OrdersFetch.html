<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Order Form</title>
    <style>
        h2 {
            text-align: center;
            font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }
        body {
            background: #E08703;
            background: linear-gradient(142deg,rgba(224, 135, 3, 1) 46%, rgba(232, 226, 39, 1) 100%);
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        form {
            text-align: center;
            margin: 8px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: rgba(224, 88, 3, 0.634);
            border-radius: 10px;
            box-shadow: 0 0 10px black;
        }

        table {
            width: 70%;
            border-collapse: collapse;
            margin-top: 20px;
            margin-left: 215px;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: left;
            background-color: whitesmoke;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        th {
            background-color: #E08703;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #111;
        }

        button {
            margin-left: 17.5rem;
            width: 30%;
            padding: 10px;
            margin-top: 15px;
            margin-bottom: 15px;
            background: rgb(235, 155, 16);
            border-radius: 8px;
            color: black;
            border: none;
            cursor: pointer;
        }

        input, select {
            border-radius: 5px;
        }

    </style>
</head>
<body>
    <div class="loadBtn">
    </div>
    <div class="container">
    <h2>Restaurant Order Form</h2>
    <button id="loadBtn">Load Orders</button>
    <hr>
    <form>
        <label>Order ID</label><br>
        <input type="number" id="id"><br><br>
        <label>Customer Name</label><br>
        <input type="text" id="name"><br><br>
        <label>Food Item</label><br>
        <input type="text" id="food"><br><br>
        <label>Quantity</label><br>
        <input type="number" id="qty"><br><br>
        <label>Total Amount</label><br>
        <input type="number" step=0.01 id="amt"><br><br>
        <label>Order Status</label><br>
        <select id="status">
            <option>Preparing</option>
            <option>Ready</option>
            <option>Delivered</option>
        </select>
    </form>
    <button onclick="addToJSON();">Submit</button>
    </div>
    <table id="orderTable">
        <thead>
            <tr>
                <th>Order ID</th>
                <th>Customer Name</th>
                <th>Food Item</th>
                <th>Quantity</th>
                <th>Total Amount</th>
                <th>Status</th>
            <tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
    </table>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="FetchOrderScript.js"></script>
</body>
</html>
